- id: the-universal-form
  source_id: bhagavad-gita
  title: The Vision of the Universal Form
  location: Bhagavad Gita 11.1-11.55
  characters:
    - Arjuna
    - Krishna
    - Sanjaya, who narrates the scene to King Dhritarashtra
  summary: >-
    After hearing Krishna speak of his greatness, Arjuna asks to see it: "I desire to see
    Thy Form omnipotent." Krishna tells him that he cannot see it with his own eyes and
    gives him "the divine eye". Arjuna sees a form "with many mouths and eyes", whose glory
    Sanjaya compares to "the splendour of a thousand suns", and in it "the whole universe,
    divided into manifold parts", standing in the body of the Deity of Deities. Wonder
    turns to terror: Arjuna says that his "inmost self is
    quaking", pleads for mercy, and asks forgiveness for having treated Krishna as an
    ordinary friend. He asks to see Krishna's familiar form again. Krishna tells him to
    "Cast fear away", takes on his gentle human form once more, and Arjuna says that he is
    "restored to my own nature". Krishna adds that this form can be known through devotion.
  dilemma: >-
    What to do when the truth one asked to see is overwhelming: keep looking, or ask to
    return to what one can bear, and whether asking to turn back is a failure.
  choices:
    - actor: Arjuna
      choice: Asks to see Krishna's imperishable Self.
      consequence: He is given "the divine eye" and sees the universal form.
    - actor: Arjuna
      choice: 'Admits his fear and asks pardon for past familiarity: "Forgive my error, O Thou boundless One."'
      consequence: 'Krishna answers his fear: "Be not bewildered, be thou not afraid".'
    - actor: Arjuna
      choice: 'Asks to see Krishna as before: "Again I fain would see Thee as before".'
      consequence: 'Krishna again assumes "a gentle form" and consoles "the terrified one".'
  lessons:
    - Awe and fear can come together; Arjuna's "heart is glad, yet faileth me for fear" (11.45).
    - It is no failure to ask for what one can bear; Krishna answers the request with consolation (11.49-11.50).
    - In the Gita, what is beyond us is approached through devotion (11.54).
  caveats:
    - This is a visionary episode in sacred poetry. It describes Arjuna's experience, not something a reader should expect or seek.
    - Its image of Time destroying the warriors belongs to the battlefield setting; it is not a teaching that suffering is deserved.
  life_situations:
    - overwhelmed by something far larger than you
    - afraid of what you asked to understand
    - needing to come back to something familiar
