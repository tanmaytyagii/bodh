- id: arjuna-at-kurukshetra
  source_id: bhagavad-gita
  title: Arjuna's Despair at Kurukshetra
  location: Bhagavad Gita 1.1-2.10, and its close in 18.63-18.73
  characters:
    - Arjuna, a prince and warrior of the Pandavas
    - Krishna, his charioteer
    - Sanjaya, who narrates the scene to King Dhritarashtra
  summary: >-
    As the battle at Kurukshetra is about to begin, Arjuna asks Krishna, his charioteer,
    to stop his chariot between the two armies so that he can see whom he must fight.
    Among the ranks he sees uncles and grandfathers, teachers, cousins, sons and
    comrades. Overcome with pity, he tells Krishna, "My limbs fail and my mouth is
    parched", and says that nothing could be worth killing his own kinsmen: "I desire not
    victory, O Krishna, nor kingdom, nor pleasures". He sinks down on the seat of the
    chariot, "casting away his bow and arrow, his mind overborne by grief". Krishna answers
    sharply: "Shake off this paltry faint-heartedness!" Arjuna admits that his mind is
    "confused as to duty" and asks to be taught. Saying "I will not fight!", he falls
    silent, and the teaching of the Gita follows. At its close Krishna tells him to reflect
    on it fully and then act as he chooses, and Arjuna answers that his delusion is
    destroyed and his doubts have fled.
  dilemma: >-
    Whether to fight against his own kinsmen, teachers and friends, or to refuse, when his
    mind is "confused as to duty", both choices seem to end in grief, and he cannot tell
    "which for us be the better".
  choices:
    - actor: Arjuna
      choice: Asks Krishna to place his chariot between the two armies, to see whom he must face.
      consequence: He sees kinsmen, teachers and friends on both sides and is overcome with pity.
    - actor: Arjuna
      choice: Casts away his bow and refuses to fight.
      consequence: He sits in the chariot "overborne by grief", unable to act.
    - actor: Krishna
      choice: 'Does not console him at first, but tells him to "Stand up".'
      consequence: 'Arjuna names his confusion and asks for help: "I am thy disciple, suppliant to Thee; teach me."'
    - actor: Arjuna
      choice: Hears the whole teaching, which Krishna asks him to reflect on fully before he acts as he chooses.
      consequence: '"Destroyed is my delusion … I am firm, my doubts have fled away. I will do according to Thy word."'
  lessons:
    - Paralysis before a hard choice is not something to hide; Arjuna names his confusion and asks for help (2.7).
    - Strong feeling does not settle what is right; the Gita's answer comes after full reflection, not instead of it (18.63).
    - A decision reached after reflection can be held firmly (18.73).
  caveats:
    - The story is set on a battlefield, but it is not an endorsement of violence or war. It frames the teaching that follows, and many readers take the battle as an image of inner conflict.
    - Arjuna's duty belonged to his own place and time; the story does not tell anyone what their own duty is.
    - Krishna's sharp words are part of the story, not a model for speaking to someone in distress.
  life_situations:
    - torn between a duty and the people you love
    - too overwhelmed to decide
    - asking for help when you cannot see the way
