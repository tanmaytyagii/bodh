- id: the-gods-and-the-mystery
  source_id: kena-upanishad
  title: The Gods and the Mysterious Spirit
  location: Kena Upanishad 3.1-4.3 (Paramananda's Parts 3-4)
  characters:
    - The Devas (gods), among them Agni (Fire), Vayu (Air) and Indra
    - Brahman, appearing as a mysterious spirit
    - Uma of golden hue, daughter of Haimavat (Himalaya)
  summary: >-
    The Brahman wins a victory for the Devas, but the Devas grow elated and think,
    "This victory is ours. This glory is ours." Brahman appears before them in a form
    they do not recognise. They send Agni to find out what it is; asked what power is in
    him, he answers that he "can burn up all whatsoever exists on earth", but when Brahman
    places a straw before him he cannot burn it. Vayu, who says he "can blow away all
    whatsoever exists on earth", cannot blow the straw away. When Indra goes, the spirit
    disappears before him, and in that same space he finds Uma, who tells him: "It is
    Brahman. It is through the victory of Brahman that ye are victorious." Agni, Vayu and
    Indra excel the other Devas because they came nearer to Brahman, and Indra most of
    all, because he was the first to know it as Brahman.
  dilemma: >-
    Whether to claim a victory as wholly their own, and how to meet a power they cannot
    explain: by asserting their own strength, or by asking what it is.
  choices:
    - actor: The Devas
      choice: 'Claim the victory as their own: "This victory is ours."'
      consequence: Brahman appears before them in a form they cannot recognise.
    - actor: Agni
      choice: Tells the mysterious spirit that he can burn up everything on earth.
      consequence: He cannot burn a single straw, and returns without learning what the spirit is.
    - actor: Vayu
      choice: Tells it that he can blow away everything on earth.
      consequence: He cannot move the straw either, and also returns without an answer.
    - actor: Indra
      choice: 'Goes himself and, when the spirit vanishes, asks Uma: "What is this great mystery?"'
      consequence: Uma tells him it is Brahman, and Indra is the first to know it.
  lessons:
    - A success that rests on more than our own effort is easily taken for our own achievement (Kena 3.1).
    - Read as a boast, their answer shows where a power ends; gods who said they could burn or blow away everything could not burn or move a straw (Kena 3.6, Kena 3.10).
    - Asking, rather than asserting, is what led to understanding (Kena 3.12, Kena 4.1).
  caveats:
    - This is a teaching story about Brahman, told in the Upanishad's own symbolic terms. It makes no claim about natural forces.
    - Its point is humility about where one's powers come from, not that effort or ability are worthless.
  life_situations:
    - taking credit for a success that others or circumstances made possible
    - pride after a win
    - meeting something you cannot explain or control
