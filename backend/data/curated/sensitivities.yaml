# Editorial context notes for passages that are easily misused or misread.
#
# Each note is attached to the listed passages (metadata.sensitivity) and is
# given to the language model with the passage, so it can explain the context
# rather than apply the verse naively. `exclude_in_crisis` keeps a passage out
# of answers to someone who may be at risk of harm.

- id: self-and-death
  note: >-
    Teaching on the indestructible self, given to a warrior before battle. Never
    present it as making death, killing or self-harm acceptable or unimportant.
  exclude_in_crisis: true
  passage_ids: [bg.2.11, bg.2.12, bg.2.13, bg.2.18, bg.2.19, bg.2.20, bg.2.21, bg.2.22,
                bg.2.23, bg.2.24, bg.2.25, bg.2.26, bg.2.27, bg.2.28, bg.2.30, bg.8.5,
                bg.8.6]

- id: deathless-self-katha
  note: >-
    Death's teaching to Nachiketas on the Self that is not born and does not die.
    Never present it as making death or self-harm acceptable or unimportant.
  exclude_in_crisis: true
  passage_ids: [katha.1.20, katha.1.21, katha.1.22, katha.2.18, katha.2.19, katha.2.22]

- id: war-exhortation
  note: >-
    In context, Krishna urges Arjuna to fight in a specific war. Never use it to
    encourage violence, revenge or harming anyone; at most it speaks to facing a
    hard duty instead of avoiding it.
  exclude_in_crisis: true
  passage_ids: [bg.2.3, bg.2.18, bg.2.31, bg.2.32, bg.2.33, bg.2.34, bg.2.35, bg.2.36,
                bg.2.37, bg.2.38, bg.3.30, bg.11.33, bg.11.34, bg.18.17, bg.18.59,
                bg.18.60]

- id: arjuna-despair
  note: >-
    Arjuna speaking in despair before Krishna's teaching begins. These are his
    arguments, which the rest of the Gita answers — not teachings to follow.
  exclude_in_crisis: false
  passage_ids: [bg.1.28, bg.1.29, bg.1.30, bg.1.31, bg.1.32, bg.1.33, bg.1.34, bg.1.35,
                bg.1.36, bg.1.37, bg.1.38, bg.1.39, bg.1.40, bg.1.41, bg.1.42, bg.1.43,
                bg.1.44, bg.1.45, bg.1.46, bg.2.4, bg.2.5, bg.2.6, bg.2.8]

- id: varna-birth-gender
  note: >-
    Concerns varna (social classes), birth or women. Interpretations differ — for
    example, whether varna rests on qualities and actions (4.13) or on birth — and
    the 1922 translation's wording reflects its era. Never use these verses to
    justify discrimination by caste, birth or gender.
  exclude_in_crisis: false
  passage_ids: [bg.1.40, bg.1.41, bg.1.42, bg.1.43, bg.1.44, bg.4.13, bg.9.32, bg.18.41,
                bg.18.42, bg.18.43, bg.18.44, bg.18.47, bg.18.48]

- id: demoniacal-natures
  note: >-
    Describes "demoniacal" qualities. Use it to reflect on one's own conduct;
    never to label, condemn or demonize other people or groups.
  exclude_in_crisis: false
  passage_ids: [bg.16.4, bg.16.5, bg.16.6, bg.16.7, bg.16.8, bg.16.9, bg.16.10, bg.16.11,
                bg.16.12, bg.16.13, bg.16.14, bg.16.15, bg.16.16, bg.16.17, bg.16.18,
                bg.16.19, bg.16.20]
