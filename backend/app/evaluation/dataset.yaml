# Retrieval evaluation set: real-life questions and the passages a good answer
# should be able to draw on.
#
# `expected` lists verses that clearly address the situation (not every
# possibly-relevant verse). `concepts` are editorial concepts that fit. A
# retrieved passage counts as relevant if it is in `expected` or belongs to one
# of the listed concepts. Verse numbers follow the Besant (1922) edition.
# `out_of_scope` questions have no good scriptural answer; the system should
# report weak evidence for them rather than force a match.

