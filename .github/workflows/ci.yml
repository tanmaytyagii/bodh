# Checks every push to main and every pull request: the backend's lint, types
# and tests, and the web app's types, lint and production build. Nothing here
# needs a secret: the tests use a stand-in for the language model, and the
# build does not need the API.

name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

# A newer push to the same branch or pull request replaces a run in progress.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    name: Backend
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: |
            backend/pyproject.toml
            backend/constraints.txt

      - name: Install
        run: pip install -c constraints.txt -e ".[dev]"

      - name: Lint
        run: |
          ruff check app tests
          ruff format --check app tests

      - name: Type-check
        run: mypy

      # The tests embed the corpus with the local model (about 130 MB on first use).
      - name: Restore the embedding model and embeddings
        uses: actions/cache@v6
        with:
          path: backend/.cache
          key: backend-cache-${{ runner.os }}-${{ hashFiles('backend/constraints.txt', 'backend/data/processed/manifest.json') }}
          restore-keys: backend-cache-${{ runner.os }}-

      - name: Test
        run: pytest

  web:
    name: Web
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: web
    env:
      NEXT_TELEMETRY_DISABLED: "1"
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: web/package-lock.json

      - name: Install
        run: npm ci

      - name: Type-check
        run: npm run typecheck

      - name: Lint
        run: npm run lint

      - name: Build
        run: npm run build
